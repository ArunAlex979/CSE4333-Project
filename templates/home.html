{% extends "base.html" %}

{% block content %}
<h1>Home</h1>
<div id="last-event-time"></div>
<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Sparkline</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for site in sites %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>
                {{ site.name }}
                <div class="battery-info">
                    Battery: {{ site.battery_level }}%
                    <div class="battery-bar-container">
                        <div class="battery-bar" style="width: {{ site.battery_level }}%; background-color: {{ 'green' if site.battery_level > 50 else ('orange' if site.battery_level > 20 else 'red') }};"></div>
                    </div>
                </div>
                <div>Last Reboot: <span id="last-reboot-{{ site.id }}"></span></div>
                <div>Last Count Increment: <span id="last-count-increment-{{ site.id }}"></span></div>
            </td>
            <td><canvas id="sparkline-{{ site.id }}"></canvas></td>
            <td>
                <a href="{{ url_for('site.site_detail', id=site.id) }}" class="btn btn-primary btn-sm">Details</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>
<script>
    const sites = {{ sites | tojson }};
    const lastEvent = {{ last_event | tojson }};
    const currentYear = new Date().getFullYear();

    function dateToIndex(dateStr, labels) {
        if (!dateStr) return -1;
        const dateObj = new Date(dateStr);
        for (let i = 0; i < labels.length; i++) {
            let labelToParse = labels[i];
            const match = labelToParse.match(/\(([^)]+)\)/);
            if (match && match[1]) labelToParse = match[1];
            const labelDate = new Date(labelToParse + " " + currentYear);
            if (labelDate >= dateObj) return i;
        }
        return labels.length;
    }

    function drawSparklines() {
        sites.forEach(site => {
            const allCounts = site.counts;
            const allLabels = site.labels;
            const current_index = site.current_index;

            let startIndex = dateToIndex(site.start_date, allLabels);
            let endIndex = dateToIndex(site.end_date, allLabels);
            if (startIndex === -1) startIndex = 0;
            if (endIndex === -1) endIndex = allLabels.length - 1;
            endIndex = Math.min(endIndex, current_index);

            const chartCounts = allLabels.map((_, i) => (i >= startIndex && i <= endIndex) ? allCounts[i] : null);
            createSparkline(`sparkline-${site.id}`, chartCounts, allLabels);
        });
    }

    function updateCountdown() {
        const now = new Date().getTime();
        sites.forEach(site => {
            const element = document.getElementById(`countdown-${site.id}`);
            if (!element || !site.next_collection_timestamp) return;

            const distance = site.next_collection_timestamp - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            element.innerHTML = (distance < 0)
                ? "Collection Due!"
                : `Next Collection in: ${days}d ${hours}h ${minutes}m ${seconds}s`;
        });
    }

    function setupCommentToggles() {
        let currentOpenComments = null;
        document.querySelectorAll('.comment-icon').forEach(icon => {
            icon.addEventListener('click', function(e) {
                e.preventDefault();
                const siteId = this.dataset.siteId;
                const container = document.getElementById(`comments-${siteId}`);
                const site = sites.find(s => s.id == siteId);

                if (currentOpenComments && currentOpenComments !== container) {
                    currentOpenComments.style.display = 'none';
                }

                if (container.style.display === 'none') {
                    container.innerHTML = `<p>${site.site_comments || "No comments available."}</p>`;
                    container.style.display = 'block';
                    currentOpenComments = container;
                } else {
                    container.style.display = 'none';
                    currentOpenComments = null;
                }
            });
        });
    }

    function updateLastEventTime() {
        const lastEventTimeDiv = document.getElementById('last-event-time');
        if (lastEvent && lastEvent.timestamp) {
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const lastEventTimestamp = moment(lastEvent.timestamp).tz(timezone).format('YYYY-MM-DD hh:mm:ss A');
            lastEventTimeDiv.innerHTML = `Last event: ${lastEventTimestamp}`;
        }
    }

    function updateSiteTimestamps() {
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        sites.forEach(site => {
            const lastRebootSpan = document.getElementById(`last-reboot-${site.id}`);
            if (lastRebootSpan && site.last_reboot_time) {
                lastRebootSpan.innerHTML = moment(site.last_reboot_time).tz(timezone).format('YYYY-MM-DD hh:mm:ss A');
            } else if (lastRebootSpan) {
                lastRebootSpan.innerHTML = "N/A";
            }

            const lastCountIncrementSpan = document.getElementById(`last-count-increment-${site.id}`);
            if (lastCountIncrementSpan && site.last_vehicle_event_time) {
                lastCountIncrementSpan.innerHTML = `${site.last_vehicle_count_increment} at ${moment(site.last_vehicle_event_time).tz(timezone).format('YYYY-MM-DD hh:mm:ss A')}`;
            } else if (lastCountIncrementSpan) {
                lastCountIncrementSpan.innerHTML = "N/A";
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        drawSparklines();
        setupCommentToggles();
        updateCountdown();
        setInterval(updateCountdown, 1000);
        updateLastEventTime();
        updateSiteTimestamps();
    });
</script>
{% endblock %}
