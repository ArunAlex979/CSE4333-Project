{% extends "base.html" %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1>Site Comments for {{ site.name }}</h1>
        </div>
        <a href="{{ url_for('home.home') }}" class="btn btn-secondary">Back to Home</a>
    </div>

    <div class="card">
        <div class="card-header">Comments</div>
        <div class="card-body">
            <p>{{ site.site_comments | default('No comments available.') }}</p>
        </div>
    </div>
{% endblock %}
