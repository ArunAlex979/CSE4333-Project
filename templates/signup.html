{% extends "base.html" %}

{% block content %}
<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="col-lg-6 col-md-8 col-sm-10 col-12">
        <div class="card shadow-lg p-5 rounded-lg">
            <div class="card-body">
                <h1 class="card-title text-center mb-4">Sign Up</h1>
                <form method="POST" action="{{ url_for('auth.signup') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-select" id="role" name="role" onchange="toggleAccessCode()">
                            <option value="reader">Reader</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="mb-3" id="access-code-group" style="display: none;">
                        <label for="access_code" class="form-label">Access Code</label>
                        <input type="text" class="form-control" id="access_code" name="access_code">
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Sign Up</button>
                    </div>
                </form>
                <p class="mt-3 text-center">
                    Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>.
                </p>
                <div class="mt-3 text-center">
                    <a href="{{ url_for('auth.guest_login') }}" class="btn btn-secondary">Continue as Guest</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleAccessCode() {
        var role = document.getElementById('role').value;
        var accessCodeGroup = document.getElementById('access-code-group');
        if (role === 'admin') {
            accessCodeGroup.style.display = 'block';
        } else {
            accessCodeGroup.style.display = 'none';
        }
    }
</script>
{% endblock %}
